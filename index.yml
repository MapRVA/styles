          - name: Positron
            link: https://styles.maprva.org/positron.json
            preview: https://overpass-ultra.us/#map&style=https://styles.maprva.org/positron.json
          - name: Dark Matter
            link: https://styles.maprva.org/dark-matter.json
            preview: https://overpass-ultra.us/#map&style=https://styles.maprva.org/dark-matter.json
          - name: MapTiler 3D
            link: https://styles.maprva.org/maptiler-3d.json
            preview: https://overpass-ultra.us/#map&style=https://styles.maprva.org/fiord-color.json
          - name: Fiord Color
