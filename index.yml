name: MapRVA Style Server
icon: https://maprva.org/img/logo.svg
description: MapLibre styles for use in MapRVA projects, including <a target="_blank" href="https://yesterdays.maprva.org">Yesterdays</a>.
resources:
  - name: OpenMapTiles Styles
    description: |
      <p>Many of the map styles from <a target="_blank" href="https://openmaptiles.org/styles/">openmaptiles.org/styles/</a></p>
      <p>Tiles & Fonts hosted by <a target="_blank" href="https://tiles.openstreetmap.us/">OpenStreetMap US</a></p>
    labels:
      #- 🖊️ Vector
      - Source -
        <a target="_blank" href="https://openstreetmap.org/">OpenStreetMap</a>
        &amp;
        <a target="_blank" href="https://openmaptiles.org">OpenMapTiles</a>
      - Tiles -
        <a target="_blank" href="https://tiles.openstreetmap.us/">OSM US</a>
      - License -
        <a target="_blank" href="https://openstreetmap.org/copyright">ODbL</a>
        &amp;
        <a target="_blank" href="https://github.com/openmaptiles/openmaptiles/blob/master/LICENSE.md#design-license-cc-by-40">CC-BY 4.0</a>
    tables:
      - title: MapLibre Styles
        rows:
          - name: OSM OpenMapTiles
            link: https://styles.maprva.org/openmaptiles-osm.json
            preview: https://overpass-ultra.us/#map&style=https://styles.maprva.org/openmaptiles-osm.json
          - name: Maptiler Basic
            link: https://styles.maprva.org/maptiler-basic.json
            preview: https://overpass-ultra.us/#map&style=https://styles.maprva.org/maptiler-basic.json
          - name: OSM Bright
            link: https://styles.maprva.org/osm-bright.json
